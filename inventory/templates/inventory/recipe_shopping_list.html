{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="hrp-page-header"><div><h1><i class="bi bi-bag"></i> Лист за пазаруване за: <span class="text-primary">{{ recipe_list.recipe_name }}</span></h1></div></div>

    <ul class="list-group mb-4">
        {% for item in recipe_list.items %}
        <li class="list-group-item d-flex align-items-center">
            <input type="checkbox" class="form-check-input me-3" id="check-{{ forloop.counter }}">
            <label class="form-check-label flex-grow-1" for="check-{{ forloop.counter }}">{{ item }}</label>
        </li>
        {% endfor %}
    </ul>

    {% if not recipe_list.executed %}
    <a href="{% url 'execute_recipe_shopping_list' recipe_list.id %}" class="btn btn-primary w-100 mb-3"><i class="bi bi-check-circle"></i> Изпълни</a>
    {% endif %}

    <div class="text-center">
        <a href="{% url 'all_shopping_lists' %}" class="btn btn-outline-secondary me-2"><i class="bi bi-arrow-left"></i> Обратно към списъци</a>
        <a href="{% url 'inventory' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Обратно към наличности</a>
    </div>
</div>
{% endblock %}
