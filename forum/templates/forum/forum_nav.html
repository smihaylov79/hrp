{% extends 'base.html' %}

{% block content %}
<nav class="hrp-tabs" aria-label="Форум">
    <a href="{% url 'forum_home' %}" class="{% if request.path == '/forum/' %}active{% endif %}"><i class="bi bi-chat-dots"></i>Форум</a>
    {% for category in forum_categories %}
    {% url 'category_threads' category.id as category_url %}
    <a href="{{ category_url }}" class="{% if request.path == category_url %}active{% endif %}">{{ category.name }}</a>
    {% endfor %}
</nav>

{% block forum_content %}
{% endblock %}

{% endblock %}
