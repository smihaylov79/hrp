{% extends "forum/forum_nav.html" %}

{% block forum_content %}

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header">
            <div class="hrp-page-header"><div><h1>Отвори нова тема за {{ category.name }}</h1></div></div>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Отвори тема</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
