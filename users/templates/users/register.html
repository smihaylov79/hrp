{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form method="POST" class="hrp-card" style="height:auto">
                <h1 class="h4 mb-3">Регистрация</h1>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Регистрирай се</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
