{% extends "base.html" %}

{% block content %}
<div class="container my-4">
  <div class="hrp-page-header">
    <div><h1>Създай нова рецепта</h1></div>
    <div class="actions"><a href="{% url 'recipe_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Рецепти</a></div>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">

      <form method="post" action="{% url 'save_recipe' %}">
        {% csrf_token %}

        <h4 class="mb-3"><i class="bi bi-clipboard"></i> Детайли</h4>

        <div class="mb-3">
          <label for="name" class="form-label">Име:</label>
          <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="category_id" class="form-label">Категория:</label>
          <select name="category_id" class="form-select" required>
            {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="time_to_prepare" class="form-label"><i class="bi bi-stopwatch"></i> Време (мин):</label>
          <input type="number" name="time_to_prepare" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="instructions" class="form-label"><i class="bi bi-book"></i> Инструкции:</label>
          <textarea name="instructions" class="form-control" rows="5"></textarea>
        </div>

        <div class="mb-3">
          <label for="url_link" class="form-label"><i class="bi bi-link-45deg"></i> URL (по желание):</label>
          <input type="url" name="url_link" class="form-control">
        </div>

        <h4 class="mt-4 mb-3"><i class="bi bi-droplet"></i> Съставки</h4>
        <div class="table-responsive">
          <table class="table align-middle" id="ingredientTable">
            <thead>
              <tr>
                <th>Продукт</th>
                <th>Количество</th>
                <th>Мярка</th>
                <th>Премахни</th>
              </tr>
            </thead>

              <tbody>
  <tr>
    <td>
      <select name="product_id[]" class="form-select" onchange="checkNewProduct(this)">
        <option value="" disabled>Избери продукт</option>
        <option value="new">Добави нов продукт</option>
        {% for product in products %}
          <option value="{{ product.id }}" {% if product.name == "Сол" %}selected{% endif %}>{{ product.name }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input type="number" name="quantity[]" class="form-control" step="0.001" value="0.01" required></td>
    <td><input type="text" name="unit[]" class="form-control" placeholder="по желание"></td>
    <td><button type="button" class="removeRow btn btn-sm btn-outline-danger"><i class="bi bi-x-lg"></i></button></td>
  </tr>

  <tr>
    <td>
      <select name="product_id[]" class="form-select" onchange="checkNewProduct(this)">
        <option value="" disabled>Избери продукт</option>
        <option value="new">Добави нов продукт</option>
        {% for product in products %}
          <option value="{{ product.id }}" {% if product.name == "Олио" %}selected{% endif %}>{{ product.name }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input type="number" name="quantity[]" class="form-control" step="0.001" value="0.01" required></td>
    <td><input type="text" name="unit[]" class="form-control" placeholder="по желание"></td>
    <td><button type="button" class="removeRow btn btn-sm btn-outline-danger"><i class="bi bi-x-lg"></i></button></td>
  </tr>
</tbody>

          </table>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" id="addRow" class="btn btn-outline-primary"><i class="bi bi-plus-lg"></i> Добави съставка</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Запази рецепта</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal for new product -->
<div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="new-product-form" method="POST">
        {% csrf_token %}

        <div class="modal-header">
          <h5 class="modal-title" id="productModalLabel"><i class="bi bi-plus-lg"></i> Добави нов продукт</h5>
          <button type="button" class="btn-close" onclick="closeModal()"></button>
        </div>

       <div class="p-3 rounded shadow-sm bg-body-tertiary border">
    {{ create_product_form.as_p }}
  </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" onclick="closeModal()">Затвори</button>
          <button type="submit" class="btn btn-primary">Запази продукта</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Add new ingredient row
document.getElementById("addRow").addEventListener("click", function () {
  const tableBody = document.querySelector("#ingredientTable tbody");
  const newRow = tableBody.rows[0].cloneNode(true);
  newRow.querySelectorAll("input, select").forEach(el => el.value = "");
  newRow.querySelector(".removeRow").addEventListener("click", function () {
    this.closest("tr").remove();
  });
  tableBody.appendChild(newRow);
});

// Remove row handler
document.querySelectorAll(".removeRow").forEach(button => {
  button.addEventListener("click", function () {
    this.closest("tr").remove();
  });
});
</script>

<script>
let activeSelect = null;

  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("new-product-form");
    const modalEl = document.getElementById("product-modal");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch("{% url 'add_product' %}", {
          method: "POST",
          body: formData,
          headers: {
            "X-CSRFToken": formData.get("csrfmiddlewaretoken"),
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (response.ok) {

  // Update ONLY the dropdown that triggered the modal
  if (activeSelect) {
    const option = document.createElement("option");
    option.value = data.id;
    option.textContent = data.name;
    option.selected = true;

    activeSelect.appendChild(option);
    activeSelect.value = data.id;  // auto-select new product
  }

  form.reset();
  const modal = bootstrap.Modal.getInstance(modalEl);
  modal.hide();
}
 else {
          // Show Django form error
          alert(data.error || "Грешка при добавянето на продукта.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Възникна грешка при добавянето на продукта.");
      }
    });
  });

      function checkNewProduct(selectElement) {
  if (selectElement.value === "new") {
    activeSelect = selectElement;  // remember which select opened the modal
    const modal = new bootstrap.Modal(document.getElementById("product-modal"));
    modal.show();
  }
}


  // Modal close logic
  function closeModal() {
    const modal = bootstrap.Modal.getInstance(document.getElementById("product-modal"));
    modal.hide();
  }
</script>

    <script src="https://cdn.tiny.cloud/1/s00wte1d6jbk5uuz52v5jhecxudzh21farxe0hvjr10n1kas/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
  tinymce.init({
    selector: 'textarea[name="instructions"]',
    menubar: false,
    plugins: 'lists link code textcolor',
    toolbar: 'bold italic underline | forecolor backcolor | bullist numlist | undo redo',
    branding: false,
    height: 300
  });
</script>



{% endblock %}
