{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="hrp-page-header"><div><h1><i class="bi bi-clipboard"></i> Добави събитие в календара</h1></div></div>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label_tag }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-floppy"></i> Запази
        </button>
    </form>
</div>
{% endblock %}
